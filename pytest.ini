[pytest]
# pytest configuration for iCGM analysis tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multi-component workflows
    slow: Tests that take significant time to run
    icgm_evaluation: Tests for icgm_analysis_evaluation module
    icgm_simulation: Tests for icgm_analysis_simulation module
    icgm_utils: Tests for icgm_analysis_utils module

# Options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (must be defined above)
    --strict-markers
    # Disable warnings for cleaner output
    --disable-warnings

# Minimum Python version
minversion = 3.8

# Logging
log_cli = false
log_cli_level = INFO

# Ignore directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache

# Console output style
console_output_style = progress
