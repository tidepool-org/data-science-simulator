[tool.black]
line-length = 120

[flake8]
max-line-length = 120

[pytest]
markers =
    slow: long-running tests, excluded from a default run (deselect with '-m "not slow"')
    docker: needs a local Docker daemon and the digest-pinned mermaid-cli image; the
        render boundary is not mocked, so these skip with a stated reason when Docker
        is absent rather than passing quietly (run 'pytest -rs' to see the skip
        reported, 'pytest -m docker' to demand them)
