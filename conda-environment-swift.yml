name: tidepool-data-science-simulator-swift
channels:
  - defaults
  - conda-forge

dependencies:
  - black=24.8.0
  - coverage=7.6.1
  - flake8=7.1.1
  - matplotlib=3.9.2
  - mypy=1.11.2
  - numexpr=2.8.7
  - numpy=1.26.4
  - pandas=2.2.2
  - pip=24.2
  - plotly=5.24.1
  - plotly-orca=3.4.2
  - pre-commit=3.4.0
  - pytest=7.4.4
  - python=3.12.7
  - requests=2.32.3
  - scipy=1.13.1
  - seaborn=0.13.2
  - gcc=14.2.0 # Needed for installing the LoopAlgorithmToPython package
  
  - pip:
    - pydantic>=2.0
    - openpyxl==3.1.5
    - streamlit==1.59.2
    - backports-datetime-fromisoformat==2.0.2
    - pip-chill==1.0.3
    - python-dotenv==1.0.1
    # Pinned to sf/incorporate_pa (not yet merged to main) -- patient.py's
    # VirtualPatient.instantiate_metabolism_model() requires the w_hr/a/tau/n
    # physical-activity params this branch adds to SimpleMetabolismModel.
    - git+https://github.com/tidepool-org/data-science-models@sf/incorporate_pa
    - git+https://github.com/tidepool-org/Pyloopkit
    - git+https://github.com/tidepool-org/data-science-metrics
    - -e ../LoopAlgorithmToPython